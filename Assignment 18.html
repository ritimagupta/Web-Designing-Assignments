<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC College Admission 2026</title>
    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
        }
        header {
            background-color: #0b2447;
            color: white;
            text-align: center;
            padding: 15px 0;
        }
        header h1 {
            margin: 0;
            font-size: 24px;
        }
        main {
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        h2 {
            font-size: 20px;
            margin-top: 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        caption {
            margin-bottom: 5px;
            font-size: 15px;
        }
        th, td {
            border: 1px solid #888;
            padding: 6px 8px;
            text-align: left;
        }
        th {
            background-color: #d9d9d9;
            text-align: center;
            font-weight: bold;
        }
        fieldset {
            border: 1px solid #aaa;
            padding: 15px;
            margin-bottom: 20px;
        }
        legend {
            padding: 0 5px;
            font-size: 15px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-size: 15px;
        }
        input[type="text"],
        input[type="email"] {
            width: 180px;
            padding: 3px;
            border: 1px solid #767676;
            border-radius: 2px;
        }
        select {
            padding: 3px;
            border: 1px solid #767676;
            border-radius: 2px;
            background-color: #f0f0f0;
        }
        textarea {
            width: 350px;
            height: 70px;
            padding: 4px;
            border: 1px solid #767676;
            border-radius: 2px;
        }
        button {
            padding: 3px 8px;
            border: 1px solid #767676;
            border-radius: 2px;
            background-color: #efefef;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-size: 13px;
        }
        button:hover {
            background-color: #e0e0e0;
        }
        footer {
            background-color: #0b2447;
            color: white;
            text-align: center;
            padding: 10px 0;
            font-size: 14px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>ABC College Admission 2026</h1>
    </header>

    <main>
        <h2>Courses and Fees</h2>
        <table>
            <caption>Available Courses</caption>
            <thead>
                <tr>
                    <th>Course</th>
                    <th>Seats</th>
                    <th>Fees</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>B.Tech CSE</td>
                    <td>120</td>
                    <td>&#8377;90,000</td>
                </tr>
                <tr>
                    <td>BCA</td>
                    <td>60</td>
                    <td>&#8377;45,000</td>
                </tr>
            </tbody>
        </table>

        <form action="#" method="post">
            <fieldset>
                <legend>Application Form</legend>
                
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="course">Course:</label>
                    <select id="course" name="course">
                        <option value="btech_cse">B.Tech CSE</option>
                        <option value="bca">BCA</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="statement">Statement:</label>
                    <textarea id="statement" name="statement"></textarea>
                </div>

                <button type="submit">Apply</button>
            </fieldset>
        </form>
    </main>

    <footer>
        &copy; 2026 ABC College
    </footer>

</body>
</html>
