<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 9: Quotation and Citation Elements</title>
    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            margin: 20px;
            line-height: 1.6;
        }
        .output-box {
            border: 1px solid #ccc;
            padding: 15px 25px;
            margin: 15px 0;
        }
    </style>
</head>
<body>
    <div class="output-box">
        <blockquote>
            The best way to predict the future is to create it.
        </blockquote>

        <p>As he said, <q>Stay hungry, stay foolish.</q></p>

        <p>Book: <cite>The Pragmatic Programmer</cite></p>

        <p><abbr title="World Wide Web Consortium">W3C</abbr> sets web standards.</p>

        <address>
            Contact: Admin Office<br>
            College Road, Delhi
        </address>

        <p><del>Old price 500</del><ins>New price 400</ins></p>
    </div>
</body>
</html>
