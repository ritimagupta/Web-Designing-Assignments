<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weekly Timetable</title>
  <style>
    table {
      border-collapse: collapse;
      width: 400px;
      text-align: center;
      font-family: Arial, sans-serif;
    }
    th, td {
      border: 1px solid black;
      padding: 8px;
    }
  </style>
</head>
<body>

  <table>
    <caption>Weekly Timetable</caption>
    <tr>
      <th>Day</th>
      <th>9-10</th>
      <th>10-11</th>
      <th>11-12</th>
    </tr>
    <tr>
      <th>Mon</th>
      <td>Maths</td>
      <td>HTML</td>
      <td rowspan="2">Web Lab</td>
    </tr>
    <tr>
      <th>Tue</th>
      <td>DBMS</td>
      <td>OS</td>
    </tr>
    <tr>
      <th>Wed</th>
      <td colspan="3">Seminar</td>
    </tr>
  </table>

</body>
</html>
