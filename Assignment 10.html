<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Assignment 10: Multimedia</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            padding: 25px;
            border: 1px solid #cccccc;
            max-width: 750px;
            margin: auto;
        }
        h2 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .aim {
            color: #555555;
            margin-bottom: 20px;
        }
        .output-heading {
            color: #2e8b57;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .output-box {
            border: 1px solid #d3d3d3;
            padding: 15px;
        }
        h4 {
            margin-top: 15px;
            margin-bottom: 8px;
        }
        img {
            max-width: 100%;
            height: auto;
        }
        video, audio {
            display: block;
            margin-bottom: 10px;
        }
        iframe {
            width: 320px;
            height: 200px;
            border: 1px solid #999999;
        }
    </style>
</head>
<body>

    <div class="container">
         <div class="output-box">
            <!-- 1. Image Section -->
            <h4>Image</h4>
            <img src="campus.jpeg" alt="College campus">

            <!-- 2. Video Section -->
            <h4>Video</h4>
            <video width="320" controls>
                <source src="sample-video.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>

            <!-- 3. Audio Section -->
            <h4>Audio</h4>
            <audio controls>
                <source src="sample-audio.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>

            <!-- 4. YouTube Section -->
            <h4>YouTube</h4>
            <iframe src="https://youtu.be/vGoiqOA6O2g?si=6LtNMRKx106Tlwgf" 
                    title="YouTube video player" 
                    allowfullscreen>
            </iframe>
        </div>
    </div>

</body>
</html>
